        <!-- Title & Status -->
        <div class="flex flex-col gap-1 items-center">
            <h1 class="brand-title">Grammar Bid</h1>
            <p id="status-text" class="status-text">Waking up server...</p>
        </div>

        <!-- Spinner -->
        <div id="spinner-box" class="my-1">
            <div class="spinner"></div>
        </div>

    </div>

    <script>
        const RENDER_URL = 'https://grammer-bid.onrender.com';
        const statusText = document.getElementById('status-text');
        let isReady = false;

        async function ping() {
            if (isReady) return;
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                const res = await fetch(`${RENDER_URL}/api/leaderboard?t=${Date.now()}`, { signal: controller.signal });
                clearTimeout(timeoutId);
                if (res.ok) setReady();
            } catch (e) {
                try {
                    const fallbackController = new AbortController();
                    const fbTimeoutId = setTimeout(() => fallbackController.abort(), 8000);
                    await fetch(`${RENDER_URL}/?t=${Date.now()}`, { mode: 'no-cors', signal: fallbackController.signal });
                    clearTimeout(fbTimeoutId);
                    setReady();
                } catch (err) { }
            }
        }

        function setReady() {
            if (isReady) return;
            isReady = true;

            statusText.innerText = 'Connected! Entering game...';
            statusText.style.color = '#34d399';
            statusText.style.animation = 'none';
            statusText.style.fontWeight = '700';

            // Auto navigate into the application
            setTimeout(() => {
                window.location.href = RENDER_URL;
            }, 300);
        }

        ping();
        const interval = setInterval(() => {
            if (isReady) clearInterval(interval);
            else ping();
        }, 2500);
    </script>
