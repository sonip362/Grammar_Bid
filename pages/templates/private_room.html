<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Bid — Private Room Lobby</title>
    <link rel="icon" type="image/webp" href="icon.webp">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400;1,600&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS & Custom Glass Stylesheet -->
    <link rel="stylesheet" href="tailwind.css">
    <link rel="stylesheet" href="style.css">
</head>

<body
    class="min-h-screen bg-slate-950 text-white font-body selection:bg-cyan-500 selection:text-white relative overflow-x-hidden flex flex-col justify-between"
    style="background-image: url('lobby.webp'); background-size: cover; background-position: center; background-attachment: fixed;">

    <!-- ── Vignette & Film Grain Overlay Layers ───────────────────── -->
    <div class="vignette-overlay fixed inset-0 z-0 pointer-events-none"></div>
    <div class="grain-overlay fixed inset-0 z-0 pointer-events-none"></div>

    <!-- ═══════════════════════════════════════
    <!-- ═══════════════════════════════════════
         TOP NAVIGATION HEADER
         ═══════════════════════════════════════ -->
    <header
        class="fixed top-0 left-0 right-0 z-40 bg-slate-950/95 backdrop-blur-xl border-b border-amber-500/20 px-3 sm:px-8 py-2.5 flex items-center justify-between shadow-lg">
        <!-- Brand Logo -->
        <a href="index.html" class="flex items-center gap-2.5 transition-transform duration-300 hover:scale-105">
            <svg width="24" height="24" viewBox="0 0 63 63" fill="none" xmlns="http://www.w3.org/2000/svg"
                class="sm:w-7 sm:h-7">
                <path
                    d="M16.6509 39.934V42.1041C16.6509 42.7034 17.1025 43.1891 17.6596 43.1891H29.7639C30.321 43.1891 30.7726 42.7034 30.7726 42.1041V39.934C30.7726 39.3348 30.321 38.849 29.7639 38.849H17.6596C17.1025 38.849 16.6509 39.3348 16.6509 39.934Z"
                    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <path
                    d="M16.6509 3.58502V5.7551C16.6509 6.35436 17.1025 6.84015 17.6596 6.84015L29.7639 6.84015C30.321 6.84015 30.7726 6.35436 30.7726 5.7551V3.58502C30.7726 2.98576 30.321 2.49997 29.7639 2.49997L17.6596 2.49997C17.1025 2.49997 16.6509 2.98576 16.6509 3.58502Z"
                    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <path
                    d="M17.9119 36.4076V38.0352C17.9119 38.4847 18.2506 38.849 18.6684 38.849H28.7553C29.1732 38.849 29.5119 38.4847 29.5119 38.0352V36.4076C29.5119 35.9582 29.1732 35.5939 28.7553 35.5939H18.6684C18.2506 35.5939 17.9119 35.9582 17.9119 36.4076Z"
                    stroke="white" stroke-width="3" />
                <path
                    d="M17.9119 7.65399V9.28155C17.9119 9.73099 18.2506 10.0953 18.6684 10.0953L28.7553 10.0953C29.1732 10.0953 29.5119 9.73099 29.5119 9.28155V7.65399C29.5119 7.20455 29.1732 6.8402 28.7553 6.8402L18.6684 6.8402C18.2506 6.8402 17.9119 7.20455 17.9119 7.65399Z"
                    stroke="white" stroke-width="3" />
                <path
                    d="M19.1725 11.4516L19.1725 34.2375C19.1725 34.9866 19.737 35.5938 20.4334 35.5938H26.9899C27.6862 35.5938 28.2507 34.9866 28.2507 34.2375V11.4516C28.2507 10.7025 27.6862 10.0953 26.9899 10.0953H20.4334C19.737 10.0953 19.1725 10.7025 19.1725 11.4516Z"
                    stroke="white" stroke-width="4" />
                <path
                    d="M17.9119 20.4032V25.2859C17.9119 25.8852 18.3635 26.371 18.9206 26.371H28.5032C29.0603 26.371 29.5119 25.8852 29.5119 25.2859V20.4032C29.5119 19.804 29.0603 19.3182 28.5032 19.3182H18.9206C18.3635 19.3182 17.9119 19.804 17.9119 20.4032Z"
                    stroke="white" stroke-width="3" />
                <path d="M28.2509 24.7434H30.7726V20.9458H28.2509V24.7434Z" stroke="white" stroke-width="3" />
                <path
                    d="M30.7725 24.2009L58.2594 23.6584C60.2768 23.6584 60.2768 22.0308 58.2594 22.0308L30.7725 21.4883V24.2009Z"
                    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <path
                    d="M49.4043 50.7346H13.5956C13.0385 50.7346 12.5869 51.2204 12.5869 51.8197V53.4472C12.5869 54.0465 13.0385 54.5323 13.5956 54.5323H49.4043C49.9614 54.5323 50.413 54.0465 50.413 53.4472V51.8197C50.413 51.2204 49.9614 50.7346 49.4043 50.7346Z"
                    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
                <path
                    d="M58.987 54.5323H4.01304C3.17741 54.5323 2.5 55.261 2.5 56.1599V58.8725C2.5 59.7713 3.17741 60.5 4.01304 60.5H58.987C59.8226 60.5 60.5 59.7713 60.5 58.8725V56.1599C60.5 55.261 59.8226 54.5323 58.987 54.5323Z"
                    stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <span class="font-heading text-lg sm:text-2xl italic tracking-wide text-white font-normal">
                Grammar Bid
            </span>
        </a>

        <!-- Center Room Title & Copy Code Button -->
        <div class="flex items-center gap-1.5 sm:gap-2">
            <span class="text-amber-400 text-sm sm:text-base">🔒</span>
            <span class="font-cinzel text-xs sm:text-base font-bold text-white tracking-wide">Lobby</span>

            <!-- Clickable Room Code capsule -->
            <button id="copy-room-code" title="Click to copy room code"
                class="ml-1 glass-pill px-2.5 py-0.5 rounded-full border border-amber-500/40 hover:border-amber-400/80 transition-all cursor-pointer flex items-center gap-1 bg-amber-500/10">
                <span class="font-mono text-amber-300 font-bold text-xs sm:text-sm tracking-wider">
                    #8326
                </span>
                <span class="text-[10px] text-amber-300/80">📋</span>
            </button>
        </div>


    </header>

    <!-- ═══════════════════════════════════════
         SUB-HEADER BAR (BELOW MAIN HEADER)
         ═══════════════════════════════════════ -->
    <div
        class="fixed top-12 sm:top-14 left-0 right-0 z-30 bg-slate-950/80 backdrop-blur-md border-b border-white/10 px-3 py-2 flex items-center justify-between sm:justify-center gap-3 text-center shadow-md">
        <!-- Player Count Badge Below Header -->
        <div
            class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 font-sans font-semibold text-xs sm:text-sm shadow-sm shrink-0">
            <span>👥</span>
            <span>Players: <strong id="player-count" class="text-white">1</strong>/4</span>
        </div>

        <!-- Room Status & Countdown Timer -->
        <p id="lobby-status"
            class="text-xs sm:text-sm text-white/90 font-serif italic tracking-wide truncate max-w-xs sm:max-w-md text-right sm:text-center">
            Connecting to server...
        </p>
    </div>

    <!-- ═══════════════════════════════════════
         MAIN SCROLLABLE PLAYERS GRID CONTENT
         ═══════════════════════════════════════ -->
    <main
        class="w-full max-w-5xl mx-auto px-3 sm:px-6 pt-28 sm:pt-32 pb-24 sm:pb-28 z-10 relative flex-1 overflow-y-auto">
        <!-- Player Cards Container: 1 Horizontal Top Card + 3 Vertical Stacked Cards Below -->
        <div id="player-grid" class="flex flex-col gap-3 sm:gap-4 max-w-3xl mx-auto w-full my-auto">
        </div>
    </main>

    <!-- ═══════════════════════════════════════
         FIXED STICKY BOTTOM ACTION FOOTER
         ═══════════════════════════════════════ -->
    <footer
        class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950/90 backdrop-blur-xl border-t border-amber-500/30 px-4 py-2.5 sm:py-3 shadow-[0_-10px_30px_rgba(0,0,0,0.9)] flex items-center justify-center gap-3 sm:gap-6">
        <a href="#" id="leave-room-btn"
            class="inline-flex items-center justify-center h-10 sm:h-12 px-4 sm:px-8 rounded-full hover:bg-rose-500/20 border border-rose-500/40 text-rose-200 font-serif italic text-xs sm:text-base transition-all duration-300 hover:scale-105 hover:text-white backdrop-blur-md cursor-pointer">
            Exit
        </a>
        <button id="invite-bot-btn"
            class="hidden inline-flex items-center justify-center h-10 sm:h-12 px-4 sm:px-6 rounded-full bg-purple-500/20 hover:bg-purple-500/40 border border-purple-500/40 text-purple-200 font-serif italic text-xs sm:text-base transition-all duration-300 hover:scale-105 cursor-pointer gap-1.5">
            <span>🤖</span> Bot
        </button>
        <button id="start-game-btn"
            class="modal-action-btn !mt-0 inline-flex items-center justify-center h-10 sm:h-12 px-6 sm:px-10 rounded-full text-white font-serif italic text-xs sm:text-base tracking-wide transition-all duration-300 hover:scale-105 hover:shadow-[0_0_35px_rgba(212,150,15,0.4)] cursor-pointer">
            Start Game
        </button>
    </footer>

    <!-- ═══════════════════════════════════════
         SIDEWAYS SLIDE-IN TOAST (BELOW HEADER)
         ═══════════════════════════════════════ -->
    <div id="toast"
        class="fixed top-24 right-3 sm:right-6 z-50 bg-slate-950/95 text-white border border-amber-500/40 px-4 py-2.5 rounded-2xl shadow-[0_10px_30px_rgba(0,0,0,0.8)] backdrop-blur-xl transform translate-x-full opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2.5 max-w-xs sm:max-w-md">
        <span id="toast-text" class="font-serif italic text-xs sm:text-sm text-white/95">Room code copied!</span>
    </div>

    <!-- Socket.io Client Library (served automatically by server) -->
    <script src="/socket.io/socket.io.js"></script>

    <!-- Lobby Client Script -->
    <script>
        // ── Auth Check ─────────────────────────────────────────
        const token = localStorage.getItem('gb_token');
        const userId = localStorage.getItem('gb_userId');
        const myUsername = localStorage.getItem('gb_username');

        if (!token || !userId) {
            window.location.href = 'login.html';
        }

        // ── DOM References ─────────────────────────────────────
        const playerGrid = document.getElementById('player-grid');
        const playerCountEl = document.getElementById('player-count');
        const roomCodeEl = document.querySelector('#copy-room-code span:first-child');
        const lobbyStatus = document.getElementById('lobby-status');
        const toast = document.getElementById('toast');
        const toastText = document.getElementById('toast-text');
        const copyBtn = document.getElementById('copy-room-code');
        const leaveBtn = document.getElementById('leave-room-btn');
        const startBtn = document.getElementById('start-game-btn');
        const inviteBotBtn = document.getElementById('invite-bot-btn');

        let currentRoomCode = null;
        let currentRoomIsPublic = false;
        const MAX_PLAYERS = 4;

        // ── Socket Connection ──────────────────────────────────
        const socket = io();

        // Determine if joining, quick match, or creating private room
        const urlParams = new URLSearchParams(window.location.search);
        const joinCode = urlParams.get('code') || urlParams.get('join');
        const mode = urlParams.get('mode');

        if (joinCode) {
            socket.emit('join_room', { roomCode: joinCode, userId });
            lobbyStatus.textContent = `Joining room #${joinCode}...`;
        } else if (mode === 'quick') {
            socket.emit('quick_match', { userId });
            lobbyStatus.textContent = 'Finding an active Quick Match room...';
        } else {
            socket.emit('create_room', { userId });
            lobbyStatus.textContent = 'Creating your private room...';
        }

        // ── Render Player Cards ────────────────────────────────
        function renderLobby(room) {
            currentRoomCode = room.code;

            const me = room.players.find(p => p.userId === userId);
            const amIHost = me ? me.isHost : false;
            currentRoomIsPublic = room.isPublic || false;

            // Sync browser URL bar to private room link format: http://.../private_room.html?mode=private&code=1234
            if (!currentRoomIsPublic && currentRoomCode) {
                const inviteUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?mode=private&code=${currentRoomCode}`;
                window.history.replaceState({}, '', inviteUrl);
            }

            // Update header room code
            if (roomCodeEl) roomCodeEl.textContent = `#${room.code}`;
            if (playerCountEl) playerCountEl.textContent = room.players.length;

            // Update status text
            if (room.players.length >= MAX_PLAYERS) {
                lobbyStatus.textContent = 'All players have joined! Ready to start.';
            } else if (room.players.length >= 2) {
                lobbyStatus.textContent = 'Ready to start! Waiting for more players or host to begin ';
            } else {
                lobbyStatus.textContent = 'Waiting for players ';
            }

            // Build 4 card slots (Player 1 Top Horizontal Hero, Players 2-4 Vertical Stack)
            let html = '';
            for (let i = 0; i < MAX_PLAYERS; i++) {
                const player = room.players[i];
                const slotNum = i + 1;

                if (i === 0) {
                    // Player 1: Featured Top Horizontal Card
                    if (player) {
                        const isHost = player.isHost;
                        const avatarUrl = player.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(player.username)}`;
                        const playerCash = (player.cash !== undefined ? player.cash : 10000).toLocaleString('en-US');
                        html += `
                        <div class="w-full p-3.5 sm:p-5 rounded-2xl sm:rounded-3xl bg-slate-900/80 backdrop-blur-xl border border-amber-400/50 shadow-[0_0_25px_rgba(212,150,15,0.2)] flex items-center justify-between gap-3 overflow-hidden relative ring-1 ring-amber-400/30 group hover:border-amber-400 transition-all">
                            <div class="absolute inset-0 bg-gradient-to-r from-amber-500/15 via-transparent to-amber-500/5 pointer-events-none"></div>
                            
                            <div class="flex items-center gap-3 sm:gap-4 z-10 overflow-hidden flex-1 min-w-0">
                                <img src="${avatarUrl}" alt="${player.username}" class="w-11 h-11 sm:w-13 sm:h-13 rounded-full object-cover border-2 border-amber-400 shadow-md shrink-0" />
                                <div class="flex flex-col overflow-hidden min-w-0">
                                    <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
                                        <span class="font-cinzel text-xs sm:text-sm font-bold text-amber-300 tracking-wider uppercase">Player 1</span>
                                        ${isHost ? '<span class="px-2 py-0.5 rounded-full bg-amber-500/20 border border-amber-400/40 text-amber-300 font-sans text-[10px] font-bold">👑 Host</span>' : ''}
                                        <span class="font-mono text-[10px] sm:text-xs text-emerald-300 bg-emerald-500/20 border border-emerald-400/40 px-2 py-0.5 rounded-full font-bold shrink-0">💵 $${playerCash}</span>
                                    </div>
                                    <span class="font-serif italic text-base sm:text-2xl text-white font-bold tracking-wide truncate mt-0.5">${player.username}</span>
                                </div>
                            </div>

                            <div class="flex items-center gap-1.5 sm:gap-2 z-10 shrink-0">
                                ${player.isBot ? `
                                    <span title="${player.rankName || 'Bot Rank'}" class="px-2 py-0.5 rounded-full ${player.isBoss ? 'bg-amber-500/25 border border-amber-500/50 text-amber-300 shadow-[0_0_12px_rgba(245,158,11,0.4)]' : 'bg-purple-500/15 border border-purple-500/30 text-purple-200'} text-xs font-bold flex items-center gap-1 shrink-0">
                                        <span class="text-sm">${player.rankBadge || '⚖️'}</span>
                                        <span class="text-[10px] hidden sm:inline font-serif italic ${player.isBoss ? 'text-amber-300 font-extrabold' : 'text-purple-300'}">${player.rankName || ''}</span>
                                        ${player.isBoss ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/30 text-amber-300 border border-amber-500/50 font-extrabold text-[9px] uppercase tracking-wider shadow-sm animate-pulse">👑 BOSS</span>' : ''}
                                    </span>
                                ` : `
                                    <span title="${player.rankName || 'Player Rank'}" class="text-sm shrink-0" role="img" aria-label="Rank Badge">${player.rankBadge || '🌱'}</span>
                                `}
                                ${amIHost && player.userId !== userId ? `
                                    <button onclick="confirmKickPlayer('${player.userId}', '${player.username.replace(/'/g, "\\'")}')" title="Kick ${player.username.replace(/'/g, "\\'")}" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-rose-500/20 hover:bg-rose-600 border border-rose-500/40 text-rose-300 hover:text-white flex items-center justify-center transition-all cursor-pointer shadow-sm hover:scale-110 active:scale-95 shrink-0" aria-label="Kick player">
                                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                                        </svg>
                                    </button>
                                ` : ''}
                                <span class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full ${player.isBot ? 'bg-purple-400 shadow-[0_0_12px_rgba(168,85,247,0.9)]' : 'bg-emerald-400 shadow-[0_0_12px_rgba(52,211,153,0.9)]'} animate-pulse" title="${player.isBot ? 'Bot' : 'Ready'}"></span>
                            </div>
                        </div>`;
                    } else {
                        html += `
                        <div class="w-full p-3.5 sm:p-5 rounded-2xl sm:rounded-3xl bg-white/[0.03] backdrop-blur-md border border-white/15 shadow-xl flex items-center justify-between gap-3 overflow-hidden relative">
                            <div class="flex items-center gap-3 z-10">
                                <div class="w-11 h-11 rounded-full bg-white/10 flex items-center justify-center text-white/40 text-base font-mono">1</div>
                                <div class="flex flex-col">
                                    <span class="font-cinzel text-xs font-bold text-white/60 tracking-wider">Player 1</span>
                                    <span class="font-mono text-sm text-white/40 tracking-widest font-black mt-0.5">....</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 z-10 shrink-0">
                                <span class="w-3 h-3 rounded-full bg-rose-500 shadow-[0_0_12px_rgba(244,63,94,0.8)] animate-pulse" title="Waiting"></span>
                            </div>
                        </div>`;
                    }
                } else {
                    // Players 2, 3, 4: Vertical Stack Cards
                    if (player) {
                        const isHost = player.isHost;
                        const avatarUrl = player.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(player.username)}`;
                        const playerCash = (player.cash !== undefined ? player.cash : 10000).toLocaleString('en-US');
                        const bgClass = isHost
                            ? 'bg-slate-900/70 border-amber-400/40 shadow-xl'
                            : 'bg-white/[0.04] border-white/10 shadow-lg';

                        html += `
                        <div class="w-full p-3 sm:p-4 rounded-xl sm:rounded-2xl ${bgClass} backdrop-blur-md border flex items-center justify-between gap-3 overflow-hidden relative group hover:border-white/30 transition-all">
                            <div class="flex items-center gap-3 z-10 overflow-hidden flex-1 min-w-0">
                                <img src="${avatarUrl}" alt="${player.username}" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full object-cover border border-amber-400/50 shadow-sm shrink-0" />
                                <div class="flex flex-col overflow-hidden min-w-0">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="font-cinzel text-[11px] sm:text-xs font-bold text-white/80 tracking-wider">Player ${slotNum}</span>
                                        ${isHost ? '<span class="text-amber-400 font-sans text-[10px] font-semibold">(Host)</span>' : ''}
                                        <span class="font-mono text-[10px] sm:text-xs text-emerald-300 bg-emerald-500/20 border border-emerald-400/40 px-1.5 py-0.5 rounded-full font-bold shrink-0">💵 $${playerCash}</span>
                                    </div>
                                    <span class="font-serif italic text-sm sm:text-lg text-white/95 font-medium tracking-wide truncate mt-0.5">${player.username}</span>
                                </div>
                            </div>

                            <div class="flex items-center gap-1.5 sm:gap-2 z-10 shrink-0">
                                ${player.isBot ? `
                                    <span title="${player.rankName || 'Bot Rank'}" class="px-2 py-0.5 rounded-full ${player.isBoss ? 'bg-amber-500/25 border border-amber-500/50 text-amber-300 shadow-[0_0_12px_rgba(245,158,11,0.4)]' : 'bg-purple-500/15 border border-purple-500/30 text-purple-200'} text-xs font-bold flex items-center gap-1 shrink-0">
                                        <span class="text-sm">${player.rankBadge || '⚖️'}</span>
                                        <span class="text-[10px] hidden sm:inline font-serif italic ${player.isBoss ? 'text-amber-300 font-extrabold' : 'text-purple-300'}">${player.rankName || ''}</span>
                                        ${player.isBoss ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/30 text-amber-300 border border-amber-500/50 font-extrabold text-[9px] uppercase tracking-wider shadow-sm animate-pulse">👑 BOSS</span>' : ''}
                                    </span>
                                ` : `
                                    <span title="${player.rankName || 'Player Rank'}" class="text-sm shrink-0" role="img" aria-label="Rank Badge">${player.rankBadge || '🌱'}</span>
                                `}
                                ${amIHost && player.userId !== userId ? `
                                    <button onclick="confirmKickPlayer('${player.userId}', '${player.username.replace(/'/g, "\\'")}')" title="Kick ${player.username.replace(/'/g, "\\'")}" class="w-7 h-7 sm:w-8 sm:h-8 rounded-full bg-rose-500/20 hover:bg-rose-600 border border-rose-500/40 text-rose-300 hover:text-white flex items-center justify-center transition-all cursor-pointer shadow-sm hover:scale-110 active:scale-95 shrink-0" aria-label="Kick player">
                                        <svg class="w-3.5 h-3.5 sm:w-4 sm:h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"></path>
                                        </svg>
                                    </button>
                                ` : ''}
                                <span class="w-2.5 h-2.5 rounded-full ${player.isBot ? 'bg-purple-400 shadow-[0_0_10px_rgba(168,85,247,0.9)]' : 'bg-emerald-400 shadow-[0_0_10px_rgba(52,211,153,0.9)]'} animate-pulse" title="${player.isBot ? 'Bot' : 'Ready'}"></span>
                            </div>
                        </div>`;
                    } else {
                        html += `
                        <div class="w-full p-3 sm:p-4 rounded-xl sm:rounded-2xl bg-white/[0.02] backdrop-blur-md border border-white/10 shadow-md flex items-center justify-between gap-3 overflow-hidden relative">
                            <div class="flex items-center gap-3 z-10">
                                <div class="w-9 h-9 rounded-full bg-white/5 flex items-center justify-center text-white/30 text-xs font-mono">${slotNum}</div>
                                <div class="flex flex-col">
                                    <span class="font-cinzel text-[11px] sm:text-xs font-bold text-white/50 tracking-wider">Player ${slotNum}</span>
                                    <span class="font-mono text-xs text-white/30 tracking-widest font-black mt-0.5">....</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-2 z-10 shrink-0">
                                <span class="w-2.5 h-2.5 rounded-full bg-rose-500/80 shadow-[0_0_10px_rgba(244,63,94,0.6)] animate-pulse" title="Waiting"></span>
                            </div>
                        </div>`;
                    }
                }
            }
            playerGrid.innerHTML = html;


            const canStart = room.players.length >= 2;

            if (startBtn) {
                if (amIHost) {
                    if (canStart) {
                        startBtn.textContent = 'Start Game';
                        startBtn.disabled = false;
                        startBtn.classList.remove('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                        startBtn.classList.add('hover:scale-105', 'cursor-pointer');
                    } else {
                        startBtn.textContent = 'Need 2 Players...';
                        startBtn.disabled = true;
                        startBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                        startBtn.classList.remove('hover:scale-105', 'cursor-pointer');
                    }
                } else {
                    startBtn.textContent = canStart ? 'Waiting for Host...' : 'Need 2+ Players...';
                    startBtn.disabled = true;
                    startBtn.classList.add('opacity-40', 'cursor-not-allowed', 'pointer-events-none');
                    startBtn.classList.remove('hover:scale-105', 'cursor-pointer');
                }
            }
            // Update Countdown Timer
            if (room.createdAt) {
                updateCountdown(room.createdAt, room.players.length);
            }

            // Show/hide Invite Bot button: Host only, private rooms only, < 4 players
            const isPublicMode = currentRoomIsPublic || mode === 'quick' || room.isPublic;
            if (inviteBotBtn) {
                if (amIHost && !isPublicMode && room.players.length < MAX_PLAYERS) {
                    inviteBotBtn.classList.remove('hidden');
                    inviteBotBtn.classList.add('inline-flex');
                } else {
                    inviteBotBtn.classList.add('hidden');
                    inviteBotBtn.classList.remove('inline-flex');
                }
            }
        }

        // ── 10-Minute Room Expiry Countdown ────────────────────
        let countdownInterval = null;

        function updateCountdown(createdAt, playerCount) {
            if (!createdAt) return;
            const expireTime = createdAt + (10 * 60 * 1000);

            if (countdownInterval) clearInterval(countdownInterval);

            const tick = () => {
                const now = Date.now();
                const diff = expireTime - now;

                if (diff <= 0) {
                    clearInterval(countdownInterval);
                    if (lobbyStatus) lobbyStatus.textContent = 'Room expired.';
                    return;
                }

                const minutes = Math.floor(diff / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                const formatted = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

                const statusBase = playerCount >= MAX_PLAYERS
                    ? 'All players joined! Ready to start.'
                    : playerCount >= 2
                        ? 'Ready to start! '
                        : 'Waiting for players ';

                if (lobbyStatus) {
                    lobbyStatus.innerHTML = `${statusBase} <span class="ml-1.5 text-amber-400 font-mono font-bold text-xs sm:text-sm">⏱️ ${formatted}</span>`;
                }
            };

            tick();
            countdownInterval = setInterval(tick, 1000);
        }

        // ── Toast Notification Helper (Sideways Slide-In Below Header) ───
        function showToast(message, icon = '📋', duration = 3000) {
            if (!toast || !toastText) return;
            toastText.innerHTML = `${icon ? icon + ' ' : ''}${message}`;
            toast.classList.remove('translate-x-full', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            setTimeout(() => {
                toast.classList.remove('translate-x-0', 'opacity-100', 'pointer-events-auto');
                toast.classList.add('translate-x-full', 'opacity-0', 'pointer-events-none');
            }, duration);
        }

        // ── Socket Event Listeners ─────────────────────────────
        socket.on('room_created', ({ roomCode, room }) => {
            console.log('Room created:', roomCode);
            renderLobby(room);
        });

        socket.on('join_success', ({ roomCode, room }) => {
            console.log('Joined room:', roomCode);
            renderLobby(room);
        });

        socket.on('player_joined', ({ username }) => {
            showToast(`<strong class="text-white">${username}</strong> joined the room!`, '👤');
        });

        socket.on('player_left', ({ username, wasHost, newHostUsername }) => {
            if (wasHost && newHostUsername) {
                showToast(`Host left. <strong class="text-amber-300 font-bold">${newHostUsername}</strong> was promoted to Host!`, '👑', 4000);
            } else {
                showToast(`<strong class="text-white">${username}</strong> left the room.`, '🚪');
            }
        });

        socket.on('lobby_updated', ({ room }) => {
            console.log('Lobby updated:', room.players.length, 'players');
            renderLobby(room);
        });

        socket.on('game_starting', ({ message }) => {
            showToast(`<strong class="text-emerald-300 font-bold">${message}</strong>`, '🚀', 3000);
            setTimeout(() => {
                window.location.href = `auction.html?room=${currentRoomCode}`;
            }, 2000);
        });

        socket.on('room_cancelled', ({ message }) => {
            showToast(`<strong class="text-rose-300 font-bold">${message}</strong>`, '⏰', 5000);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3500);
        });

        socket.on('join_error', ({ message }) => {
            showToast(`<strong class="text-rose-300">${message}</strong>`, '⚠️', 3500);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        });

        socket.on('disconnect', () => {
            lobbyStatus.textContent = 'Disconnected from server. Reconnecting...';
        });

        socket.on('connect', () => {
            if (currentRoomCode) {
                socket.emit('join_room', { roomCode: currentRoomCode, userId });
            }
        });

        // ── 3-Second Room Status Polling Fallback ──────────────
        setInterval(() => {
            if (currentRoomCode) {
                socket.emit('get_room_status', { roomCode: currentRoomCode });
            }
        }, 3000);

        // ── Copy Full Private Room Link ─────────────────────────
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                if (!currentRoomCode) return;
                const inviteUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?mode=private&code=${currentRoomCode}`;
                navigator.clipboard.writeText(inviteUrl).then(() => {
                    showToast(`Invite link copied to clipboard:<br><span class="font-mono text-xs text-amber-300 break-all">${inviteUrl}</span>`, '🔗', 4500);
                }).catch(err => {
                    navigator.clipboard.writeText(currentRoomCode);
                    showToast(`Room code <strong class="font-mono text-white">#${currentRoomCode}</strong> copied to clipboard!`, '📋');
                });
            });
        }

        // ── Leave Room ─────────────────────────────────────────
        if (leaveBtn) {
            leaveBtn.addEventListener('click', (e) => {
                e.preventDefault();
                socket.disconnect();
                window.location.href = 'index.html';
            });
        }

        socket.on('you_were_kicked', ({ message }) => {
            showToast(`<strong class="text-rose-300">${message || 'You were kicked by the host.'}</strong>`, '🚫', 5000);
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2500);
        });

        socket.on('player_kicked_notify', ({ message }) => {
            showToast(`<strong class="text-amber-300">${message}</strong>`, '🚫', 4000);
        });

        // ── Log Out with Confirmation ────────────────────────────
        const logoutBtn = document.getElementById('logout-btn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                showConfirmModal({
                    title: 'Log Out',
                    message: 'Are you sure you want to log out of Grammar Bid?',
                    confirmText: 'Log Out',
                    onConfirm: () => {
                        socket.disconnect();
                        localStorage.removeItem('gb_token');
                        localStorage.removeItem('gb_userId');
                        localStorage.removeItem('gb_username');
                        localStorage.removeItem('gb_avatar');
                        localStorage.removeItem('gb_cash');
                        window.location.href = 'login.html';
                    }
                });
            });
        }

        // ── Start Game (Host Only) ─────────────────────────────
        if (startBtn) {
            startBtn.addEventListener('click', () => {
                if (!currentRoomCode) return;
                socket.emit('start_game', { roomCode: currentRoomCode, userId });
            });
        }

        // ── Kick Player Helper ──────────────────────────────────
        window.confirmKickPlayer = function (targetUserId, targetUsername) {
            showConfirmModal({
                title: `Kick ${targetUsername}`,
                message: `Are you sure you want to kick ${targetUsername}? They will be removed and banned from rejoining this room.`,
                confirmText: 'Kick Player',
                onConfirm: () => {
                    if (socket && currentRoomCode) {
                        socket.emit('kick_player', { roomCode: currentRoomCode, userId, targetUserId });
                    }
                }
            });
        };

        // ── Invite Bot (Host Only, Private Rooms) ───────────────
        if (inviteBotBtn) {
            inviteBotBtn.addEventListener('click', () => {
                const isPublicMode = currentRoomIsPublic || mode === 'quick';
                if (!currentRoomCode || isPublicMode) return;
                socket.emit('add_bot', { roomCode: currentRoomCode, userId });
            });
        }

        socket.on('bot_added', ({ username }) => {
            showToast(`<strong class="text-purple-300">${username}</strong> (Bot) has joined!`, '🤖');
        });
    </script>

    <!-- ═══════════════════════════════════════
         CONFIRMATION MODAL (LOGOUT, KICK, ETC.)
         ═══════════════════════════════════════ -->
    <div id="confirm-modal-backdrop"
        class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div id="confirm-modal"
            class="relative w-full max-w-sm bg-slate-950/95 border border-amber-500/40 rounded-3xl p-6 sm:p-7 shadow-[0_0_50px_rgba(212,150,15,0.25)] flex flex-col gap-5 text-white transform scale-95 transition-all duration-300 text-center">
            <div id="confirm-modal-icon"
                class="w-12 h-12 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 text-2xl flex items-center justify-center mx-auto shadow-md">
                ⚠️
            </div>
            <div>
                <h3 id="confirm-modal-title" class="font-cinzel text-xl font-bold text-white tracking-wide">Confirm
                    Action</h3>
                <p id="confirm-modal-text"
                    class="text-xs sm:text-sm font-serif italic text-white/80 mt-1.5 leading-relaxed">Are you sure you
                    want to proceed?</p>
            </div>
            <div class="flex items-center gap-3 mt-1">
                <button id="confirm-cancel-btn"
                    class="w-1/2 py-2.5 rounded-full border border-white/20 text-white/80 hover:text-white hover:bg-white/10 text-xs font-serif italic transition-all cursor-pointer">
                    Cancel
                </button>
                <button id="confirm-ok-btn"
                    class="w-1/2 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-lg hover:scale-105 transition-all cursor-pointer">
                    Confirm
                </button>
            </div>
        </div>
    </div>

    <!-- Script file for reusable helpers -->
    <script src="bgMusic.js"></script>
    <script src="tutorialManager.js"></script>
    <script src="script.js"></script>
</body>
