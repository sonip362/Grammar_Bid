<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Bid — Server Logs</title>
    <link href="../tailwind.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f1a;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        .log-info {
            border-left: 3px solid #38bdf8;
        }

        .log-warn {
            border-left: 3px solid #fbbf24;
        }

        .log-error {
            border-left: 3px solid #f87171;
        }

        .log-debug {
            border-left: 3px solid #a78bfa;
        }
    </style>
</head>

<body class="min-h-screen text-white">

    <!-- Top Bar -->
    <header
        class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-xl border-b border-white/10 px-4 sm:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <span class="text-2xl">📋</span>
            <h1 class="font-cinzel text-xl sm:text-2xl font-bold text-white tracking-wide">Server Logs</h1>
        </div>
        <div class="flex items-center gap-2 sm:gap-3">
            <select id="log-filter"
                class="px-3 py-2 rounded-xl bg-white/10 border border-white/20 text-white text-xs outline-none cursor-pointer">
                <option value="all">All Levels</option>
                <option value="info">ℹ️ Info</option>
                <option value="warn">⚠️ Warn</option>
                <option value="error">❌ Error</option>
                <option value="debug">🔧 Debug</option>
            </select>
            <button id="logs-refresh-btn"
                class="px-4 py-2 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 text-xs font-bold hover:bg-cyan-500/30 transition-all cursor-pointer">
                🔄 Refresh
            </button>
            <button id="logs-clear-btn"
                class="px-4 py-2 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-bold hover:bg-rose-500/30 transition-all cursor-pointer">
                🗑️ Clear All
            </button>
            <a href="broadcast.html"
                class="px-4 py-2 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30 transition-all">
                📣 Broadcast
            </a>
            <a href="index.html"
                class="px-4 py-2 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold hover:bg-amber-500/30 transition-all">
                ← Dashboard
            </a>
        </div>
    </header>

    <!-- Stats -->
    <div class="px-4 sm:px-8 py-3 flex flex-wrap items-center gap-3">
        <span id="log-count-badge"
            class="px-3 py-1 rounded-full bg-white/5 border border-white/15 text-xs text-white/70 font-bold">
            Total: 0
        </span>
        <span id="log-auto" class="text-[10px] text-white/30">Auto-refreshes every 10s</span>
    </div>

    <!-- Logs List -->
    <main class="px-4 sm:px-8 pb-8">
        <div id="logs-list" class="flex flex-col gap-2">
            <div class="text-center text-white/40 text-sm py-12 font-serif italic animate-pulse">
                Loading logs...
            </div>
        </div>
    </main>

    <!-- Clear Confirmation Modal -->
    <div id="clear-modal"
        class="fixed inset-0 z-50 bg-black/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div id="clear-modal-card"
            class="w-full max-w-sm bg-slate-950/95 border border-rose-500/40 rounded-3xl p-6 shadow-[0_0_50px_rgba(244,63,94,0.2)] flex flex-col gap-4 text-white text-center transform scale-95 transition-all duration-300">
            <span class="text-4xl">🗑️</span>
            <h2 class="font-cinzel text-xl font-bold text-rose-300">Clear All Logs?</h2>
            <p class="text-xs text-white/60">This will permanently delete all server logs from the database.</p>
            <div class="flex items-center gap-3">
                <button id="clear-cancel-btn"
                    class="w-1/2 py-2.5 rounded-full border border-white/20 text-white/80 hover:bg-white/10 text-sm transition-all cursor-pointer">
                    Cancel
                </button>
                <button id="clear-confirm-btn"
                    class="w-1/2 py-2.5 rounded-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm shadow-lg hover:scale-105 transition-all cursor-pointer">
                    Delete All
                </button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_SESSION_KEY = 'gb_admin_token';
        const adminToken = sessionStorage.getItem(ADMIN_SESSION_KEY);
        if (!adminToken) {
            window.location.href = 'index.html';
        }

        const logsList = document.getElementById('logs-list');
        const logFilter = document.getElementById('log-filter');
        const refreshBtn = document.getElementById('logs-refresh-btn');
        const clearBtn = document.getElementById('logs-clear-btn');
        const clearModal = document.getElementById('clear-modal');
        const clearModalCard = document.getElementById('clear-modal-card');
        const clearCancelBtn = document.getElementById('clear-cancel-btn');
        const clearConfirmBtn = document.getElementById('clear-confirm-btn');
        const logCountBadge = document.getElementById('log-count-badge');

        let allLogs = [];

        async function loadLogs() {
            try {
                const res = await fetch('/api/admin/logs', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                if (res.status === 401) {
                    sessionStorage.removeItem(ADMIN_SESSION_KEY);
                    window.location.href = 'index.html';
                    return;
                }
                const data = await res.json();
                allLogs = data.logs || [];
                renderLogs();
            } catch (err) {
                logsList.innerHTML = '<p class="text-rose-400 text-sm text-center py-8">Failed to load logs.</p>';
            }
        }

        function renderLogs() {
            const filter = logFilter.value;
            const filtered = filter === 'all' ? allLogs : allLogs.filter(l => l.level === filter);

            logCountBadge.textContent = `Showing: ${filtered.length} / ${allLogs.length}`;

            if (filtered.length === 0) {
                logsList.innerHTML = '<p class="text-white/30 text-sm text-center py-12 font-serif italic">No logs found.</p>';
                return;
            }

            logsList.innerHTML = filtered.map(log => {
                const levelColors = {
                    info: 'text-sky-300 bg-sky-500/10',
                    warn: 'text-amber-300 bg-amber-500/10',
                    error: 'text-rose-300 bg-rose-500/10',
                    debug: 'text-violet-300 bg-violet-500/10'
                };
                const levelIcons = { info: 'ℹ️', warn: '⚠️', error: '❌', debug: '🔧' };
                const cls = levelColors[log.level] || levelColors.info;
                const icon = levelIcons[log.level] || 'ℹ️';
                const time = new Date(log.timestamp).toLocaleString();

                return `
                    <div class="log-${log.level} p-3 rounded-xl bg-white/[0.02] border border-white/5 hover:border-white/15 transition-all flex items-start gap-3">
                        <span class="px-2 py-0.5 rounded-lg text-[10px] font-bold uppercase ${cls} shrink-0 mt-0.5">
                            ${icon} ${log.level}
                        </span>
                        <p class="text-xs text-white/85 font-mono flex-1 whitespace-pre-wrap break-all leading-relaxed">${escapeHtml(log.message)}</p>
                        <span class="text-[10px] text-white/30 shrink-0 font-mono">${time}</span>
                    </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        logFilter.addEventListener('change', renderLogs);
        refreshBtn.addEventListener('click', loadLogs);

        // Clear modal
        clearBtn.addEventListener('click', () => {
            clearModal.classList.remove('hidden');
            setTimeout(() => {
                clearModal.classList.remove('opacity-0');
                clearModalCard.classList.remove('scale-95');
                clearModalCard.classList.add('scale-100');
            }, 10);
        });

        function hideModal() {
            clearModal.classList.add('opacity-0');
            clearModalCard.classList.remove('scale-100');
            clearModalCard.classList.add('scale-95');
            setTimeout(() => clearModal.classList.add('hidden'), 300);
        }

        clearCancelBtn.addEventListener('click', hideModal);

        clearConfirmBtn.addEventListener('click', async () => {
            try {
                await fetch('/api/admin/logs', {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                allLogs = [];
                renderLogs();
                hideModal();
            } catch (err) {
                alert('Failed to clear logs.');
            }
        });

        loadLogs();
        setInterval(loadLogs, 10000);
    </script>
</body>

</html>
