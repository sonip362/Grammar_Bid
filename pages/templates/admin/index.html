<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar Bid — Admin Panel</title>
    <link href="../tailwind.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Cinzel:wght@400;700;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0f1a;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        .dot-online {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 8px #34d399;
        }

        .dot-offline {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #64748b;
        }
    </style>
</head>

<body class="min-h-screen text-white">

    <!-- ═══════════ LOCK SCREEN ═══════════ -->
    <div id="lock-screen"
        class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-[#0b0f1a] to-slate-950">
        <div
            class="w-full max-w-sm bg-slate-900/90 border border-amber-500/40 rounded-3xl p-8 shadow-[0_0_60px_rgba(212,150,15,0.2)] flex flex-col gap-5 text-center">
            <div>
                <span class="text-5xl">🔐</span>
                <h1 class="font-cinzel text-2xl font-bold text-amber-300 mt-3 tracking-wide">Admin Access</h1>
                <p class="text-xs text-white/50 mt-1">Enter your secure admin code</p>
            </div>
            <input id="admin-code-input" type="password" placeholder="Admin Code..."
                class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white text-center text-lg font-mono tracking-[0.3em] placeholder-white/30 outline-none focus:border-amber-400 transition-all" />
            <button id="admin-unlock-btn"
                class="w-full py-3 rounded-full bg-gradient-to-r from-amber-500 to-amber-300 text-slate-950 font-bold text-sm shadow-lg hover:scale-105 transition-all cursor-pointer">
                Unlock Panel
            </button>
            <p id="lock-error" class="text-xs text-rose-400 hidden"></p>
        </div>
    </div>

    <!-- ═══════════ ADMIN DASHBOARD ═══════════ -->
    <div id="admin-dashboard" class="hidden">
        <!-- Top Bar -->
        <header
            class="sticky top-0 z-40 bg-slate-950/95 backdrop-blur-xl border-b border-white/10 px-4 sm:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span class="text-2xl">⚙️</span>
                <h1 class="font-cinzel text-xl sm:text-2xl font-bold text-white tracking-wide">Admin Panel</h1>
            </div>
            <div class="flex items-center gap-3">
                <a href="reports.html"
                    class="px-4 py-2 rounded-full bg-rose-500/20 border border-rose-500/40 text-rose-300 text-xs font-bold hover:bg-rose-500/30 transition-all">
                    📋 Reports
                </a>
                <a href="broadcast.html"
                    class="px-4 py-2 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-bold hover:bg-emerald-500/30 transition-all">
                    📣 Broadcast & Rewards
                </a>
                <a href="logs.html"
                    class="px-4 py-2 rounded-full bg-cyan-500/20 border border-cyan-500/40 text-cyan-300 text-xs font-bold hover:bg-cyan-500/30 transition-all">
                    📋 Server Logs
                </a>
                <button id="admin-refresh-btn"
                    class="px-4 py-2 rounded-full bg-amber-500/20 border border-amber-500/40 text-amber-300 text-xs font-bold hover:bg-amber-500/30 transition-all cursor-pointer">
                    🔄 Refresh
                </button>
            </div>
        </header>

        <!-- Stats Bar -->
        <div class="px-4 sm:px-8 py-4 flex flex-wrap items-center gap-4">
            <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/30">
                <span class="dot-online"></span>
                <span class="text-xs font-bold text-emerald-300">Online: <span id="online-count">0</span></span>
            </div>
            <div class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 border border-white/15">
                <span class="text-xs font-bold text-white/80">Total Users: <span id="total-count">0</span></span>
            </div>
        </div>

        <!-- Users Grid -->
        <main class="px-4 sm:px-8 pb-8">
            <div id="users-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <div class="text-center text-white/40 text-sm py-12 col-span-full font-serif italic animate-pulse">
                    Loading users...
                </div>
            </div>
        </main>
    </div>

    <script>
        const ADMIN_SESSION_KEY = 'gb_admin_token';
        const lockScreen = document.getElementById('lock-screen');
        const dashboard = document.getElementById('admin-dashboard');
        const codeInput = document.getElementById('admin-code-input');
        const unlockBtn = document.getElementById('admin-unlock-btn');
        const lockError = document.getElementById('lock-error');
        const usersGrid = document.getElementById('users-grid');
        const onlineCount = document.getElementById('online-count');
        const totalCount = document.getElementById('total-count');
        const refreshBtn = document.getElementById('admin-refresh-btn');

        let adminToken = sessionStorage.getItem(ADMIN_SESSION_KEY);

        if (adminToken) {
            showDashboard();
        }

        unlockBtn.addEventListener('click', async () => {
            const code = codeInput.value.trim();
            if (!code) {
                lockError.textContent = 'Please enter the admin code.';
                lockError.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/api/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code })
                });
                const data = await res.json();
                if (data.success) {
                    adminToken = data.token;
                    sessionStorage.setItem(ADMIN_SESSION_KEY, adminToken);
                    showDashboard();
                } else {
                    lockError.textContent = data.error || 'Invalid admin code.';
                    lockError.classList.remove('hidden');
                    codeInput.value = '';
                }
            } catch (err) {
                lockError.textContent = 'Connection error. Try again.';
                lockError.classList.remove('hidden');
            }
        });

        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') unlockBtn.click();
        });

        function showDashboard() {
            lockScreen.classList.add('hidden');
            dashboard.classList.remove('hidden');
            loadUsers();
        }

        async function loadUsers() {
            try {
                const res = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                if (res.status === 401) {
                    sessionStorage.removeItem(ADMIN_SESSION_KEY);
                    location.reload();
                    return;
                }
                const data = await res.json();
                renderUsers(data.users, data.onlineUserIds);
            } catch (err) {
                usersGrid.innerHTML = '<p class="text-rose-400 text-sm col-span-full text-center py-8">Failed to load users.</p>';
            }
        }

        function formatCash(n) {
            return '$' + Number(n).toLocaleString('en-US');
        }

        function renderUsers(users, onlineIds) {
            const online = new Set(onlineIds || []);
            let onlineN = 0;

            usersGrid.innerHTML = users.map(u => {
                const isOn = online.has(u._id);
                if (isOn) onlineN++;

                const cleanUsername = String(u.username || '').replace(/'/g, "\\'");

                return `
                    <div class="flex items-center gap-3 p-4 rounded-2xl bg-white/[0.03] border border-white/10 hover:border-white/25 transition-all">
                        <div class="relative shrink-0">
                            <img src="${u.avatar || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(u.username)}`}"
                                class="w-12 h-12 rounded-full object-cover border-2 ${isOn ? 'border-emerald-400' : 'border-slate-600'}" />
                            <span class="absolute bottom-0 right-0 ${isOn ? 'dot-online' : 'dot-offline'} border-2 border-slate-950"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <p class="text-sm font-bold text-white truncate">${u.username}</p>
                            <p class="text-[11px] text-white/50 mb-1">Games: ${u.gamesPlayed || 0} · Won: ${u.gamesWon || 0}</p>
                            <button onclick="deleteUser('${u._id}', '${cleanUsername}')"
                                class="px-2.5 py-1 rounded-lg bg-rose-500/20 hover:bg-rose-500/40 border border-rose-500/40 text-rose-300 text-[11px] font-bold transition-all cursor-pointer flex items-center gap-1">
                                🗑️ Delete
                            </button>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="font-mono text-sm font-bold ${(u.cash || 10000) >= 10000 ? 'text-emerald-300' : 'text-rose-400'}">${formatCash(u.cash !== undefined ? u.cash : 10000)}</p>
                            <p class="text-[10px] ${isOn ? 'text-emerald-400' : 'text-white/30'} font-bold uppercase">${isOn ? '● Online' : '○ Offline'}</p>
                        </div>
                    </div>
                `;
            }).join('');

            onlineCount.textContent = onlineN;
            totalCount.textContent = users.length;
        }

        async function deleteUser(userId, username) {
            if (!confirm(`Are you sure you want to permanently delete user "${username}"?`)) return;

            try {
                const res = await fetch(`/api/admin/users/${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${adminToken}` }
                });
                const data = await res.json();
                if (data.success) {
                    loadUsers();
                } else {
                    alert(data.error || 'Failed to delete user.');
                }
            } catch (err) {
                alert('Error deleting user.');
            }
        }

        refreshBtn.addEventListener('click', loadUsers);
        setInterval(loadUsers, 15000);
    </script>
</body>

</html>
